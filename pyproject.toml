[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dubtool"
version = "0.1.0"
description = "Video dubbing into Uzbek with speaker voice cloning."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

# Pinned against a real `pip freeze` of a working macOS ARM64 CPU install
# (step-2 MVP verified end to end against this exact set on 2026-09-23,
# updated 2026-09-23 for pyannote/prosody-cloning changes).
# numpy==2.4.6 despite torch/transformers historically preferring the 1.x
# line: this venv proved CosyVoice2 + the rest of the stack works fine
# against it, so it's pinned as verified rather than downgraded on spec.
#
# onnxruntime must stay >=1.20 to hold that numpy pin. 1.18.0 (what
# CosyVoice2's own requirements.txt asks for, alongside numpy==1.26.4) is
# built against the numpy 1.x C ABI and dies on import under numpy 2 with
# "AttributeError: _ARRAY_API not found". It appeared to work only because
# poc/.venv had numpy installed twice -- 1.26.4 left in place underneath
# 2.4.6's metadata -- so the old ABI was still on disk there. A venv built
# cleanly from this file got the real numpy 2.4.6 and could not import the
# TTS backend at all. Verified end to end on 1.31.0 + numpy 2.4.6.
#
# lightning was bumped 2.2.4->2.6.6 by installing pyannote.audio, which
# requires a newer lightning than CosyVoice2's own stack was verified
# against — re-verified CosyVoice2 construction *and* synthesis both still
# work fine under 2.6.6 before accepting the bump.
dependencies = [
  "numpy==2.4.6",
  "torch==2.14.0",
  "torchaudio==2.11.0",
  "transformers==4.51.3",
  "sentencepiece==0.2.2",
  "sacremoses==0.2.0",   # MarianTokenizer (OPUS-MT) wants this; silent quality fallback without it
  "librosa==0.10.2",
  "soundfile==0.12.1",
  "pyyaml==6.0.3",
  "demucs==4.1.0",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",  # MADLAD translator loads its CTranslate2 model directly
  "conformer==0.3.2",
  "diffusers==0.29.0",
  "lightning==2.6.6",
  "HyperPyYAML==1.2.3",
  "onnxruntime==1.31.0",  # >=1.20 required for the numpy 2 ABI; see note above
  "inflect==7.3.1",
  "x-transformers==2.11.24",
  "wetext==0.0.4",
  "pyworld==0.3.5; sys_platform == 'win32'",
  "pyworld==0.3.4; sys_platform != 'win32'",
  "omegaconf==2.3.0",
  "hydra-core==1.3.2",
  "networkx==3.6.1",
  "pyarrow==18.1.0",
  # Bumped from 2.7.0 when the optional google-genai dependency (see the
  # `gemini` extra below) required newer pydantic-core than 2.7.0 allows —
  # re-verified CosyVoice2 construction *and* a real synthesize() call both
  # still work fine under 2.13.5 before accepting the bump, same precedent
  # as the lightning bump above.
  "pydantic==2.13.5",
  "openai-whisper==20250625",
  "gdown==6.4.0",
  "matplotlib==3.11.2",
  "wget==3.2",
  "rootutils==1.0.7",
  "scipy==1.17.1",
  "python-dotenv==1.2.3",
  "pyannote.audio==4.0.7",  # optional in practice: only loaded if diarize=pyannote/auto+HF_TOKEN
  "spacy==3.8.16",  # auto-detecting character/place names from the transcript (stages/auto_names.py)
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "resemblyzer==0.1.4",  # cross-run voice identity matching (stages/voice_bank.py)
  "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Opt-in translate backend (backends["translate"] = "gemini") — a paid
# cloud API, not needed for the default local-model pipeline, so it's not
# in the unconditional `dependencies` list above.
gemini = ["google-genai==2.25.0"]

[project.scripts]
dubtool = "dubtool.cli:main"

[tool.hatch.metadata]
# en_core_web_sm above is a direct URL dependency (spaCy's model wheels
# aren't on PyPI) -- hatchling refuses to generate metadata for those
# unless explicitly allowed.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dubtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: slow, real-model end-to-end pipeline test (run explicitly with `pytest -m integration`)",
]
