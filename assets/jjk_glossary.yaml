# Glossary for Jujutsu Kaisen (JJK), for use with --glossary.
#
# Researched from the Jujutsu Kaisen Fandom wiki and Wikipedia (character
# list, terminology/glossary categories) since no official Uzbek dub or
# localization of the show exists to draw fixed terms from. Uzbek renderings
# for terminology below are original working translations, not an official
# source — treat them as a reasonable, *consistent* starting point (the
# actual point of a glossary: the same term comes out the same way in every
# segment, since MADLAD has no memory across translate() calls) rather than
# a claim of definitive canon. Feel free to edit any translation below; the
# mechanism (stages/glossary.py) enforces whatever this file says, verbatim,
# every time that term appears.
#
# Format: source term (English, as it'll appear in the transcript) -> fixed
# Uzbek rendering. A name that should just pass through unchanged (not
# translated) maps to itself.

